services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: vibecoders-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dgraph Zero ──────────────────────────────────────────────────────────────
  dgraph-zero:
    image: dgraph/dgraph:latest
    container_name: vibecoders-dgraph-zero
    command: dgraph zero --my=dgraph-zero:5080
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph_zero_data:/dgraph

  # ── Dgraph Alpha ─────────────────────────────────────────────────────────────
  dgraph-alpha:
    image: dgraph/dgraph:latest
    container_name: vibecoders-dgraph-alpha
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=0.0.0.0/0
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph_alpha_data:/dgraph
    depends_on:
      - dgraph-zero

  # ── Cassandra ────────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4
    container_name: vibecoders-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=vibecoders
      - CASSANDRA_NUM_TOKENS=16
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mongo_data:
  dgraph_zero_data:
  dgraph_alpha_data:
  cassandra_data:
